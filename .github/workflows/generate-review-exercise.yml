name: Generate Review Exercise

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Difficulty tier (1-4)'
        required: false
        default: '2'
      topic:
        description: 'Topic (react-hooks, accessibility, typescript, async-data-fetching, component-architecture, performance, forms, routing)'
        required: false
        default: 'react-hooks'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Generate feature with bugs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIER: ${{ github.event.inputs.tier }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: node scripts/generate-review-exercise.mjs

      - name: Open PR with generated code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="exercise/review-$(date +%Y%m%d-%H%M%S)"
          git config user.name "ai-code-gym[bot]"
          git config user.email "ai-code-gym[bot]@users.noreply.github.com"
          git checkout -b $BRANCH
          git add exercises/review-mode/
          git commit -m "feat: [REVIEW EXERCISE] tier-${TIER} ${TOPIC} feature"
          git push origin $BRANCH
          gh pr create \
            --title "[Review Exercise] Tier ${{ github.event.inputs.tier }}: ${{ github.event.inputs.topic }}" \
            --body "$(cat exercises/review-mode/latest-pr-description.md)" \
            --base main \
            --head $BRANCH \
            --label "review-exercise"
