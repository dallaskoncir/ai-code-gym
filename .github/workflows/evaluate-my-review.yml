name: Evaluate My Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number of the review exercise you just reviewed'
        required: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk @octokit/rest

      - name: Fetch PR diff and review comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: node scripts/fetch-pr-review.mjs

      - name: Run review critic agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: node scripts/evaluate-review.mjs

      - name: Post feedback as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh pr comment $PR_NUMBER --body-file feedback/latest-evaluation.md
